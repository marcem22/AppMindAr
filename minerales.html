<html lang="es">
<head>

     <link rel="icon" type="image/png" href="assets/LOGO SIED SOLO-01.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --theme-dark: #4a2511;
            --theme-primary: #b87333;
            --theme-accent: #d4af37;
            --theme-light: #fcd581;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000; 
            color: #e0e0e0;
            overflow-x: hidden;
            overflow-y: auto;
        }

        #home {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 140px; 
            overflow: visible;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 40px 140px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        

        .header-logo {
            max-height: 90px; 
            width: auto;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .back-home-btn {
            width: 44px; height: 44px; border-radius: 50%; padding: 0;
            display: flex; justify-content: center; align-items: center;
            color: white; background: rgba(0, 0, 0, 0.3); border: 2px solid white;
            text-decoration: none; font-size: 22px; z-index: 100;
            transition: all 0.3s ease; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            touch-action: manipulation;
        }

        .back-home-btn:hover { 
            background: white; color: black; transform: scale(1.1); 
        }

        .full-screen-image {
            position: fixed; 
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; 
            z-index: 1; 
            filter: brightness(0.7); 
            opacity: 0;
            animation: fadeInCover 1.2s ease-out forwards;
        }

        @keyframes fadeInCover {
            to { opacity: 1; }
        }

        .color-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, rgba(0,0,0,0.9) 20%, rgba(var(--theme-primary-rgb), 0.2) 60%, rgba(0,0,0,0.7));
            z-index: 2;
        }

        .hero-content {
    max-width: 500px;
    z-index: 4; 
    position: relative;
    margin-left: 120px; 
}

        .hero-subtitle {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            position: relative;
            padding-left: 25px;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.2s forwards;
            text-shadow: 2px 2px 6px #000000, 0 0 15px #000000;
        }

        .hero-subtitle::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 15px;
            height: 2px;
            background-color: var(--theme-primary);
        }

        .hero-title {
            font-size: 68px;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 30px;
            letter-spacing: -1.5px;
            color: #fff;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.4s forwards;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
        }

        .hero-description {
    font-size: 16px;
    color: #ffffff;
    margin-bottom: 40px;
    border-left: 2px solid var(--theme-primary);
    padding: 15px 25px;
    line-height: 1.6;
    opacity: 0;
    animation: fadeInUp 0.8s ease-out 0.6s forwards;
    background-color: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    border-radius: 8px;
}

        .hero-description strong {
            color: #fff;
            font-weight: 600;
        }

        .learn-more-btn {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            padding: 10px 0;
            transition: gap 0.3s ease;
            text-decoration: none;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.8s forwards;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .learn-more-btn:hover {
            gap: 25px;
        }

        .learn-more-btn .arrow-circle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 35px;
            height: 35px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transition: border-color 0.3s ease;
            background-color: rgba(0,0,0,0.3); /* Hace que el botón resalte más */
        }

        .learn-more-btn:hover .arrow-circle {
            border-color: #fff;
            background-color: rgba(255,255,255,0.1);
        }

        .learn-more-btn .arrow {
            font-size: 20px;
        }

        .page-indicator {
            position: fixed;
            bottom: 40px;
            left: 140px;
            font-size: 48px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.1);
            z-index: 10;
            letter-spacing: -1px;
        }

        .page-indicator span {
            font-size: 22px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 400;
        }

        /* Responsivo */
        @media (max-width: 1200px) {
            #home { padding: 0 80px; }
            header { padding: 30px 80px; }
            .hero-title { font-size: 54px; }
            .page-indicator { left: 80px; }
        }

        @media (max-width: 992px) {
            body {
                overflow-y: auto;
                min-height: 100vh;
            }
            
            #home {
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 100px 50px 60px;
                min-height: 100vh;
                height: auto;
            }
            
            header {
                padding: 25px 50px;
                background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            }
            
            .hero-content { 
                max-width: 100%; 
                width: 100%;
                text-align: center; 
                margin-left: 0;
            }
            
            .hero-subtitle {
                font-size: 16px;
                margin-bottom: 25px;
                padding-left: 0;
            }
            
            .hero-subtitle::before { display: none; }
            
            .hero-title {
                font-size: 52px;
                margin-bottom: 30px;
                line-height: 1.2;
            }
            
            .hero-description {
                font-size: 18px;
                margin-bottom: 40px;
                line-height: 1.7;
                padding: 20px; 
                border-left: none;
                /* En móvil aplicamos un fondo tenue por defecto ya que no hay hover */
                background-color: rgba(0, 0, 0, 0.5);
                backdrop-filter: blur(4px);
                -webkit-backdrop-filter: blur(4px);
            }
            
            .learn-more-btn { 
                margin: 0 auto;
                justify-content: center;
                display: flex;
                font-size: 18px;
                gap: 20px;
            }
            
            .arrow-circle {
                width: 40px !important;
                height: 40px !important;
            }
            
            .page-indicator {
                position: relative;
                font-size: 42px;
                left: auto;
                bottom: auto;
                text-align: center;
                margin-top: 40px;
            }
        }
        
        @media (max-width: 768px) {
            #home {
                padding: 90px 40px 60px;
            }
            
            header {
                padding: 20px 40px;
            }
            
            .header-logo {
                max-height: 40px !important;
            }
            
            .hero-title {
                font-size: 44px;
            }
            
            .hero-description {
                font-size: 17px;
            }
        }
        
        @media (max-width: 480px) {
            #home { padding: 80px 30px 50px; }
            header { padding: 18px 30px; }
            .header-logo { max-height: 35px !important; }
            .hero-title { font-size: 36px; }
            .hero-description { font-size: 16px; }
        }
        /* =========================================================
           FONDO PARA EL LOGO (TODAS LAS PANTALLAS)
           ========================================================= */
        .header-logo {
            background-color: rgba(0, 0, 0, 0.5) !important;
            padding: 10px 20px !important;
            border-radius: 15px !important;
            backdrop-filter: blur(5px) !important;
        }

        /* =========================================================
           MODO PANTALLA GIGANTE - INDEX MINERALES
           ========================================================= */
        @media (min-width: 1600px) {
            .header-logo {
                max-height: 110px !important;
                position: absolute !important;
                top: 110px !important;
                left: 140px !important;
                transform: translateY(-50%) !important;
                padding: 15px 30px !important; /* Un poco más de fondo para pantalla grande */
            }

            .hero-content { max-width: 600px !important; }

            .hero-subtitle {
                font-size: 24px !important;
                font-weight: 800 !important;
                padding-left: 35px !important;
            }

            .hero-subtitle::before { width: 22px !important; height: 3px !important; }

            .hero-title { font-size: 85px !important; margin-bottom: 40px !important; }

            .hero-description {
                font-size: 26px !important;
                border-left: 4px solid var(--theme-primary) !important;
                padding-left: 30px !important;
                margin-bottom: 50px !important;
            }

            .learn-more-btn { font-size: 26px !important; }
            .learn-more-btn .arrow-circle {
                width: 45px !important; height: 45px !important;
                border: 2px solid rgba(255, 255, 255, 0.4) !important;
            }
            .learn-more-btn .arrow { font-size: 28px !important; }
        }
        @media (min-width: 2560px) {
  .header-logo { max-height: 250px !important; top: 180px !important; left: 160px !important; padding: 25px 45px !important; border-radius: 25px !important; }
  .hero-content { max-width: 85% !important; margin-left: 160px !important; margin-right: 160px !important; }
  .hero-subtitle { font-size: 65px !important; padding-left: 60px !important; margin-bottom: 50px !important; }
  .hero-subtitle::before { width: 45px !important; height: 6px !important; }
  .hero-title { font-size: 250px !important; margin-bottom: 80px !important; letter-spacing: -5px !important; line-height: 1.1 !important; width: 100% !important; }
  .hero-description { font-size: 75px !important; border-left: 10px solid var(--theme-primary) !important; padding: 35px 55px !important; margin-bottom: 90px !important; line-height: 1.6 !important; border-radius: 15px !important; max-width: 100% !important; }
  .learn-more-btn { font-size: 75px !important; gap: 35px !important; }
  .learn-more-btn .arrow-circle { width: 90px !important; height: 90px !important; border-width: 4px !important; }
  .learn-more-btn .arrow { font-size: 55px !important; }
  .page-indicator { font-size: 120px !important; left: 160px !important; bottom: 100px !important; }
  .page-indicator span { font-size: 60px !important; }
}
    </style>
</head>
<body>
    <div id="home">
        <header>
    <a href="index.html" style="pointer-events: auto; display: inline-block;">
        <img src="./assets/LOGO SIED SOLO-01.png" class="header-logo" alt="SIED Logo">
    </a>
</header>

        <img src="./assets/sanJuan.png" alt="Expo Minera San Juan" class="full-screen-image">
        <div class="color-backdrop"></div>

        <div class="hero-content">
            <div class="hero-subtitle">Recursos Minerales de San Juan</div>
            <h1 class="hero-title">Explorá los tesoros de nuestra tierra</h1>
            <p class="hero-description">
                Nuestra geología esconde minerales fundamentales para la industria y la tecnología. 
                Pulsa "Explorar Minerales" para descubrir en Realidad Aumentada los recursos más representativos de San Juan.
            </p>
            <a href="minerales-elements.html" class="learn-more-btn">
                Explorar Minerales
                <span class="arrow-circle">
                    <span class="arrow">&rarr;</span>
                </span>
            </a>
        </div>
    </div>
</body>
