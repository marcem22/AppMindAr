<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>MiningTech - AR Espacial</title>
  
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      background: radial-gradient(circle at center, #0f0f10 0%, #000 100%);
      color: white;
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header { padding: 20px 25px; display: flex; justify-content: flex-end; align-items: center; background: transparent; z-index: 20; position: absolute; width: 100%; top: 0; left: 0; pointer-events: none; }
    .close-btn { background: rgba(0, 0, 0, 0.4); border: 2px solid rgba(50, 100, 194, 0.9); border-radius: 50%; width: 48px; height: 48px; color: white; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; pointer-events: auto; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0, 255, 153, 0.3); backdrop-filter: blur(5px); }
    .close-btn:hover { background: rgba(50, 100, 194, 0.9); color: white; transform: scale(1.05); }

    .visor-container {
      flex-grow: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: transparent; 
      --poster-color: transparent;
    }

    .model-info {
      position: absolute;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(21, 59, 130, 0.15);
      padding: 12px 24px;
      border-radius: 12px;
      border: 1px solid rgba(21, 59, 130, 0.5);
      text-align: center;
      pointer-events: none;
      backdrop-filter: blur(8px);
      z-index: 10;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .model-name {
      font-size: 20px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-proyectar {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #2e3be4, #301c77);
      color: #ffff;
      border: none;
      border-radius: 30px;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,255,153,0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-proyectar:active {
      transform: translateX(-50%) scale(0.95);
    }

    .btn-captura {
      position: absolute;
      right: 20px;
      bottom: 40px;
      width: 60px;
      height: 60px;
      background: rgba(21, 59, 130, 0.9);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      color: white;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 40;
      box-shadow: 0 4px 15px rgba(21, 59, 130, 0.4);
      transition: transform 0.2s, background 0.2s;
    }

    .btn-captura:active {
      transform: scale(0.9);
    }

    @media (max-width: 768px) {
        .model-info {
            top: 65px ; 
            left: 50% !important;
            transform: translateX(-50%) !important;
        }

        .btn-proyectar {
            bottom: 30px !important; 
            width: 85% !important; 
        }

        .btn-captura {
            bottom: 130px !important; 
            right: 15px !important;
            transform: scale(0.9) !important;
        }
    }

    /* =========================================================
       MODO PANTALLA GIGANTE (PROYECTOR / SMART TV)
       ========================================================= */
    @media (min-width: 1600px) {
      .header { padding: 30px 40px; }
      
      /* Botón Home con un tamaño equilibrado */
      .close-btn { width: 60px; height: 60px; font-size: 28px; border-width: 2px; }

      /* El Nombre pasa arriba a la izquierda */
      .model-info {
        top: 30px;
        left: 40px !important;
        right: auto;
        transform: none !important;
        padding: 15px 30px;
      }
      
      /* Tamaño del título más sutil */
      .model-name {
        font-size: 30px; 
      }

      /* Botones inferiores más controlados */
      .btn-captura {
        width: 75px;
        height: 75px;
        font-size: 32px;
        bottom: 50px;
        right: 50px;
      }

      .btn-proyectar {
        padding: 18px 36px;
        font-size: 20px;
        bottom: 50px;
      }
    }
    @media (min-width: 2560px) {
  .header { padding: 80px 100px; }
  .close-btn { width: 150px; height: 150px; font-size: 50px; border-width: 4px; }
  .model-info { top: 100px; left: 100px !important; padding: 40px 80px; border-width: 4px; border-radius: 25px; }
  .model-name { font-size: 75px; }
  .btn-captura { width: 140px; height: 140px; font-size: 65px; bottom: 100px; right: 100px; border-width: 4px; }
  .btn-proyectar { padding: 40px 80px; font-size: 45px; bottom: 100px; border-radius: 80px; }
}
  </style>
</head>
<body>

  <div class="header">
    <button class="close-btn" onclick="window.history.back()">🏠</button>
  </div>

  <div class="visor-container">
    <!-- NOMBRE DEL MODELO (ARRIBA A LA IZQ EN PANTALLA GIGANTE) -->
    <div class="model-info">
      <div class="model-name" id="nombreModelo">Cargando...</div>
    </div>

    <model-viewer 
      id="visorModelo"
      src=""
      alt="Modelo 3D"
      ar 
      ar-modes="webxr scene-viewer quick-look" 
      camera-controls 
      auto-rotate
      autoplay
      shadow-intensity="1">
      
      <button slot="ar-button" class="btn-proyectar">
        <span></span> Proyectar en el espacio
      </button>

    </model-viewer>
    
    <button class="btn-captura" id="btnCaptura">📷</button>
  </div>

  <script>
    const parametrosUrl = new URLSearchParams(window.location.search);
    const modeloSolicitado = parametrosUrl.get('modelo') || 'tunel';
    const nombreSolicitado = parametrosUrl.get('nombre') || 'Maquinaria';

    const visor = document.getElementById('visorModelo');
    const nombreUI = document.getElementById('nombreModelo');
    const btnCaptura = document.getElementById('btnCaptura');

    const isProduction = window.location.hostname.includes('github.io');
    const BASE_PATH = isProduction ? '/AppMindAr/models/' : 'models/';

    visor.src = BASE_PATH + modeloSolicitado + '.glb';
    nombreUI.textContent = nombreSolicitado;

    btnCaptura.addEventListener('click', async () => {
      btnCaptura.style.background = "orange";
      try {
        const blob = await visor.toBlob({ idealAspect: true });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = `MiningAR-${Date.now()}.png`;
        link.href = url;
        link.click();
        URL.revokeObjectURL(url);
      } catch (error) {
        console.error(error);
      }
      setTimeout(() => {
        btnCaptura.style.background = "rgba(21, 59, 130, 0.9)";
      }, 500);
    });
  </script>
</body>
</html>
