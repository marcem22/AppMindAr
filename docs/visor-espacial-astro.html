<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>SIED - AR Espacial Astronomía</title>
  
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      background: radial-gradient(circle at center, #0f0f10 0%, #000 100%);
      color: white;
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Solución para evitar zoom con doble toque en los controles del visor */
    button, a {
      touch-action: manipulation;
    }

    .header {
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
      z-index: 20;
      position: absolute;
      width: 100%;
      top: 0;
    }

    .logo {
      font-weight: 700;
      font-size: 22px;
      color: #fff;
    }

    .logo span {
      color: #8a2be2;
    }

    .close-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(0,0,0,0.3);
      border: 2px solid white;
      color: white;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .close-btn:hover {
      background: white;
      color: black;
      transform: scale(1.1);
    }

    .visor-container {
      flex-grow: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: transparent; 
      --poster-color: transparent;
      touch-action: none;
    }

    .model-info {
      position: absolute;
      top: 110px; 
      left: 200px !important; 
      transform: none !important; 
      background: rgba(0, 0, 0, 0.5); 
      padding: 12px 24px;
      border-radius: 12px;
      border: 1px solid rgba(138, 43, 226, 0.3);
      text-align: left;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 10;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      pointer-events: none;
    }

    .model-name {
      font-size: 20px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #c9a8ff;
    }

    /* Panel de controles añadido para Astro */
    .controls-panel {
      position: absolute; 
      left: 20px; 
      bottom: 30px;
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      z-index: 150;
    }

    .control-btn {
      width: 55px; 
      height: 55px; 
      background: rgba(138, 43, 226, 0.2); 
      border: 2px solid #8a2be2;
      border-radius: 12px; 
      color: #c9a8ff; 
      font-size: 24px; 
      font-weight: bold; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      user-select: none;
      transition: all 0.2s;
    }

    .control-btn:active { 
      background: #8a2be2; 
      color: #fff; 
    }

    .btn-proyectar {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #c9a8ff, #8a2be2);
      color: #000;
      border: none;
      border-radius: 30px;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(138,43,226,0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.2s, box-shadow 0.2s;
      z-index: 100;
    }

    .btn-proyectar:active {
      transform: translateX(-50%) scale(0.95);
    }

    .btn-captura {
      position: absolute;
      right: 20px;
      bottom: 40px;
      width: 60px;
      height: 60px;
      background: rgba(107, 33, 168, 0.9);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      color: white;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 40;
      box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
      transition: transform 0.2s, background 0.2s;
    }

    .btn-captura:active {
      transform: scale(0.9);
    }

    @media (max-width: 768px) {
        .model-info {
            top: 90px !important;
            left: 20px !important;
            padding: 8px 16px;
        }

        .model-name {
            font-size: 16px !important;
        }

        .btn-proyectar {
            bottom: 30px !important; 
            width: 85% !important; 
        }

        .btn-captura {
            bottom: 130px !important; 
            right: 15px !important;
            transform: scale(0.9) !important;
        }

        .controls-panel {
            bottom: 130px !important; 
            left: 15px !important;
            transform: scale(0.9) !important;
        }
    }
  </style>
  <script type="module" crossorigin src="/AppMindAr/assets/modulepreload-polyfill-B5Qt9EMX.js"></script>
</head>
<body>

  <div class="header">
    <div class="logo">SIED <span>Astron</span></div>
    <button class="close-btn" onclick="window.history.back()" title="Volver">←</button>
  </div>

  <div class="visor-container">
    <div class="model-info">
      <div class="model-name" id="nombreModelo">Cargando...</div>
    </div>

    <model-viewer 
      id="visorModelo"
      src=""
      alt="Modelo Celeste"
      ar 
      ar-modes="webxr scene-viewer quick-look" 
      camera-controls 
      touch-action="pan-y"
      shadow-intensity="1">
      
      <button slot="ar-button" class="btn-proyectar">
        <span></span> Proyectar en el espacio
      </button>

    </model-viewer>

    <div class="controls-panel">
      <button class="control-btn" id="plus">+</button>
      <button class="control-btn" id="minus">-</button>
      <button class="control-btn" id="left">↺</button>
      <button class="control-btn" id="right">↻</button>
    </div>
    
    <button class="btn-captura" id="btnCaptura">📷</button>
  </div>

  <script>
    const parametrosUrl = new URLSearchParams(window.location.search);
    const modeloSolicitado = parametrosUrl.get('modelo') || 'sun';
    const nombreSolicitado = parametrosUrl.get('nombre') || 'Objeto Celeste';
    
    // Capturamos el número exacto de escala
    let escalaActual = parseFloat(parametrosUrl.get('escala')) || 0.2;

    const visor = document.getElementById('visorModelo');
    const nombreUI = document.getElementById('nombreModelo');
    const btnCaptura = document.getElementById('btnCaptura');

    const isProduction = window.location.hostname.includes('github.io');
    const BASE_PATH = isProduction ? '/AppMindAr/models/' : 'models/';

    visor.src = BASE_PATH + modeloSolicitado + '.glb';
    nombreUI.textContent = nombreSolicitado;

    // Aplicamos la escala inicial que viene de la lista
    visor.scale = `${escalaActual} ${escalaActual} ${escalaActual}`;

    // Lógica para botones de control
    let timer;
    function iniciarAccion(accion) { accion(); timer = setInterval(accion, 40); }
    function detenerAccion() { clearInterval(timer); }

    const acciones = {
      plus: () => { escalaActual += 0.002; visor.scale = `${escalaActual} ${escalaActual} ${escalaActual}`; },
      minus: () => { if (escalaActual > 0.002) escalaActual -= 0.002; visor.scale = `${escalaActual} ${escalaActual} ${escalaActual}`; },
      left: () => { const o = visor.getCameraOrbit(); visor.cameraOrbit = `${o.theta - 0.05}rad ${o.phi}rad ${o.radius}m`; },
      right: () => { const o = visor.getCameraOrbit(); visor.cameraOrbit = `${o.theta + 0.05}rad ${o.phi}rad ${o.radius}m`; }
    };

    ['plus', 'minus', 'left', 'right'].forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('mousedown', () => iniciarAccion(acciones[id]));
      el.addEventListener('touchstart', (e) => { e.preventDefault(); iniciarAccion(acciones[id]); }, { passive: false });
      el.addEventListener('mouseup', detenerAccion);
      el.addEventListener('mouseleave', detenerAccion);
      el.addEventListener('touchend', detenerAccion);
    });

    // Función de foto
    btnCaptura.addEventListener('click', async () => {
      btnCaptura.style.background = "orange";
      try {
        const blob = await visor.toBlob({ idealAspect: true });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = `AstroAR-${Date.now()}.png`;
        link.href = url;
        link.click();
        URL.revokeObjectURL(url);
      } catch (error) {
        console.error(error);
      }
      setTimeout(() => {
        btnCaptura.style.background = "rgba(107, 33, 168, 0.9)";
      }, 500);
    });
  </script>
</body>
</html>
