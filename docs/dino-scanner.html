  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --dino-primary: #d35400;
      --dino-light: #f39c12;
      --dino-r: 211, 84, 0;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at center, #1a120b 0%, #000 100%);
      color: white;
      width: 100vw; height: 100dvh;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* Cabecera transparente y sin logo, solo para posicionar el botón */
    .header {
      padding: 20px 25px; display: flex; justify-content: flex-end; align-items: center;
      background: transparent; z-index: 20; position: absolute; width: 100%; top: 0; left: 0;
      pointer-events: none; /* Deja que los toques pasen a través del div vacío */
    }

    .close-btn {
      background: rgba(26, 18, 11, 0.6); border: 2px solid var(--dino-primary); border-radius: 50%;
      width: 48px; height: 48px; color: white; font-size: 22px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; text-decoration: none;
      pointer-events: auto; /* Reactiva los toques solo para el botón */
      transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(var(--dino-r), 0.3);
      backdrop-filter: blur(5px);
    }
    
    .close-btn:hover { background: var(--dino-primary); transform: scale(1.05); }

    .visor-container { flex-grow: 1; width: 100%; position: relative; }

    model-viewer {
      width: 100%; height: 100%; background: transparent; 
      --poster-color: transparent; touch-action: none; 
    }

    .btn-proyectar {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, var(--dino-light), var(--dino-primary)); 
      color: #fff; border: none; border-radius: 30px;
      padding: 16px 32px; font-size: 16px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(var(--dino-r), 0.4); cursor: pointer; z-index: 100;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .btn-proyectar:active { transform: translateX(-50%) scale(0.95); }

    .model-info {
      position: absolute; top: 25px; left: 50%; transform: translateX(-50%);
      background: rgba(26, 18, 11, 0.7); padding: 10px 24px; border-radius: 50px;
      border: 1px solid var(--dino-primary); text-align: center; pointer-events: none; z-index: 10;
      backdrop-filter: blur(5px); box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .model-name { font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #fff;}

    .controls-panel {
      position: absolute; left: 20px; bottom: 40px;
      display: flex; flex-direction: column; gap: 12px; z-index: 150;
    }

    .control-btn {
      width: 55px; height: 55px; background: rgba(var(--dino-r), 0.15); border: 2px solid var(--dino-primary);
      border-radius: 12px; color: var(--dino-light); font-size: 24px; font-weight: bold; cursor: pointer; 
      display: flex; align-items: center; justify-content: center; user-select: none;
      backdrop-filter: blur(4px); transition: all 0.2s;
    }

    .control-btn:active { background: var(--dino-primary); color: #fff; transform: scale(0.95); }

    .btn-captura {
      position: absolute; right: 20px; bottom: 40px; width: 60px; height: 60px;
      background: rgba(var(--dino-r), 0.9); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; 
      color: white; font-size: 24px; display: flex; align-items: center; justify-content: center; 
      cursor: pointer; z-index: 40; box-shadow: 0 4px 15px rgba(var(--dino-r), 0.4);
      transition: transform 0.2s;
    }
    
    .btn-captura:active { transform: scale(0.9); background: var(--dino-light); }

    @media (max-width: 768px) {
      .model-info { top: 25px; }
      .header { padding: 15px; }
      .close-btn { width: 42px; height: 42px; font-size: 18px; }
      .btn-proyectar { bottom: 30px; width: 85%; }
      .btn-captura { bottom: 130px; right: 15px; transform: scale(0.9); }
      .controls-panel { bottom: 130px; left: 15px; transform: scale(0.9); }
    }
    @media (min-width: 1600px) {
      .header { padding: 40px 60px; }
      .close-btn { width: 80px; height: 80px; font-size: 36px; border-width: 3px; }
      .model-info {
        top: 40px; left: 60px !important; right: auto;
        transform: none !important; padding: 15px 35px;
        border-width: 2px;
      }
      .model-name { font-size: 35px; }
      .controls-panel {
        left: 60px; bottom: 60px; gap: 20px;
      }
      .control-btn {
        width: 80px; height: 80px; font-size: 36px; border-width: 3px; border-radius: 20px;
      }
      .btn-captura {
        width: 100px; height: 100px; font-size: 45px; bottom: 60px; right: 60px; border-width: 3px;
      }
      .btn-proyectar {
        padding: 24px 48px; font-size: 24px; bottom: 60px;
      }
    }
    @media (min-width: 2560px) {
  .header { padding: 100px 120px; }
  .close-btn { width: 130px; height: 130px; font-size: 55px; border-width: 4px; }
  .model-info { top: 120px; left: 120px !important; right: auto !important; transform: none !important; padding: 45px 90px; border-width: 4px; border-radius: 30px; }
  .model-name { font-size: 60px; }
  .controls-panel { left: 120px; bottom: 120px; gap: 30px; }
  .control-btn { width: 130px; height: 130px; font-size: 55px; border-width: 4px; border-radius: 30px; }
  .btn-captura { width: 150px; height: 150px; font-size: 70px; bottom: 120px; right: 120px; border-width: 4px; }
  .btn-proyectar { padding: 45px 90px; font-size: 50px; bottom: 120px; border-radius: 90px; }
}
  </style>
  <script type="module" crossorigin src="/AppMindAr/assets/modulepreload-polyfill-B5Qt9EMX.js"></script>
</head>
<body>

  <div class="header">
    <button class="close-btn" onclick="window.location.href='index-dino.html'">🏠</button>
  </div>

  <div class="visor-container">
    <div class="model-info">
      <div class="model-name" id="nombreDino">Cargando...</div>
    </div>

   <model-viewer 
      id="visorDino"
      src=""
      alt="Modelo 3D"
      ar 
      autoplay
      auto-rotate
      ar-modes="webxr scene-viewer quick-look" 
      camera-controls 
      touch-action="pan-y"
      shadow-intensity="1">
      
      <button slot="ar-button" class="btn-proyectar">Proyectar en el ambiente</button>
    </model-viewer>

    <div class="controls-panel">
      <button class="control-btn" id="plus">+</button>
      <button class="control-btn" id="minus">-</button>
      <button class="control-btn" id="left">↺</button>
      <button class="control-btn" id="right">↻</button>
    </div>
    
    <button class="btn-captura" id="btnCaptura">📷</button>
  </div>

 <script>
  const dinos = [
    { slug: 'giganotosaurus', archivo: 'giganotosaurus.glb', sonido: 'sounds/giganotosaurus.mp3', nombre: 'Giganotosaurus', escalaWeb: 0.05, orientacion: '0deg 0deg 0deg', tieneUsdz: true },
    { slug: 'brachiosaurus', archivo: 'brachiosaurus.glb', sonido: 'sounds/brachiosaurus.mp3', nombre: 'Brachiosaurus', escalaWeb: 0.05, orientacion: '0deg 0deg 0deg' },
    { slug: 'trex', archivo: 'trex.glb', sonido: 'sounds/trex.mp3', nombre: 'T-Rex', escalaWeb: 0.15, orientacion: '0deg 0deg 0deg' },
    { slug: 'triceratops', archivo: 'triceratops.glb', sonido: 'sounds/triceratops.mp3', nombre: 'Triceratops', escalaWeb: 1, orientacion: '0deg 0deg 0deg' },
    { slug: 'velociraptor', archivo: 'velociraptor.glb', sonido: 'sounds/velociraptor.mp3', nombre: 'Velociraptor', escalaWeb: 0.495, orientacion: '0deg 0deg 0deg'},
    { slug: 'stegosaurio', archivo: 'stegosaurio.glb', sonido: 'sounds/stegosaurio.mp3', nombre: 'Stegosaurus', escalaWeb: 0.05, orientacion: '0deg 0deg 0deg' },
    { slug: 'ankylosaurus', archivo: 'ankylosaurus.glb', sonido: 'sounds/ankylosaurus.mp3', nombre: 'Ankylosaurus', escalaWeb: 0.001, orientacion: '0deg 0deg 0deg' }
  ];

  const params = new URLSearchParams(window.location.search);
  const modUrl = params.get('modelo') || params.get('marker') || 'trex';

  
  const isProd = window.location.hostname.includes('github.io');
  const repoName = isProd ? window.location.pathname.split('/')[1] : '';
  const BASE_PATH = isProd ? `/${repoName}/models/` : 'models/';

  const visor = document.getElementById('visorDino');
  const nombreUI = document.getElementById('nombreDino');
  const reproductorAudio = new Audio();

  const dinoData = dinos.find(d => d.slug === modUrl) || dinos[1];
  let escalaActual = dinoData.escalaWeb;

  function cargarDino() {
    const pathGlb = BASE_PATH + dinoData.archivo;
    
    visor.src = pathGlb;
    
    if (dinoData.tieneUsdz) {

      visor.setAttribute('ios-src', pathGlb.replace('.glb', '.usdz'));
    } else {
      visor.removeAttribute('ios-src');
    }
    
    nombreUI.textContent = dinoData.nombre;
    visor.scale = `${escalaActual} ${escalaActual} ${escalaActual}`;
    visor.orientation = dinoData.orientacion || '0deg 0deg 0deg';
    
    const soundPath = isProd ? `/${repoName}/${dinoData.sonido}` : dinoData.sonido;
    reproductorAudio.src = soundPath;
  }

  cargarDino();

  document.body.addEventListener('click', () => {
    if (reproductorAudio.paused) reproductorAudio.play().catch(() => {});
  }, { once: true });

  let timer;
  function iniciarAccion(accion) { accion(); timer = setInterval(accion, 40); }
  function detenerAccion() { clearInterval(timer); }

  const acciones = {
    plus: () => { escalaActual += 0.002; visor.scale = `${escalaActual} ${escalaActual} ${escalaActual}`; },
    minus: () => { if (escalaActual > 0.002) escalaActual -= 0.002; visor.scale = `${escalaActual} ${escalaActual} ${escalaActual}`; },
    left: () => { const o = visor.getCameraOrbit(); visor.cameraOrbit = `${o.theta - 0.05}rad ${o.phi}rad ${o.radius}m`; },
    right: () => { const o = visor.getCameraOrbit(); visor.cameraOrbit = `${o.theta + 0.05}rad ${o.phi}rad ${o.radius}m`; }
  };

  ['plus', 'minus', 'left', 'right'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('mousedown', () => iniciarAccion(acciones[id]));
    el.addEventListener('touchstart', (e) => { e.preventDefault(); iniciarAccion(acciones[id]); }, { passive: false });
    el.addEventListener('mouseup', detenerAccion);
    el.addEventListener('mouseleave', detenerAccion);
    el.addEventListener('touchend', detenerAccion);
  });

  const btnCaptura = document.getElementById('btnCaptura');
  btnCaptura.addEventListener('click', async () => {
    btnCaptura.style.background = "white";
    try {
      const blob = await visor.toBlob({ idealAspect: true });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.download = `Dino-${Date.now()}.png`;
      link.href = url; link.click(); URL.revokeObjectURL(url);
    } catch (e) {}
    setTimeout(() => { btnCaptura.style.background = "rgba(211, 84, 0, 0.9)"; }, 500);
  });

</script>
</body>
</html>
