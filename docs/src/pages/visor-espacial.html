      var ua = navigator.userAgent;
      if (ua.indexOf('Firefox') > -1) {
        document.documentElement.classList.add('browser-firefox');

  <title>MiningTech - AR Espacial</title>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <script type="module" crossorigin src="/AppMindAr/assets/visor-espacial-0mB4ZXia.js"></script>
  <link rel="modulepreload" crossorigin href="/AppMindAr/assets/data-CsTPyq8q.js">
  <link rel="stylesheet" crossorigin href="/AppMindAr/assets/visor-espacial-BC0cxQxh.css">
</head>

<body>

  <div class="header">
    <button class="close-btn" onclick="window.history.back()" aria-label="Volver">
      <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </button>
  </div>

  <div class="visor-container">
    <!-- NOMBRE DEL MODELO (ARRIBA A LA IZQ EN PANTALLA GIGANTE) -->
    <div class="model-info">
      <div class="model-name" id="nombreModelo">Cargando...</div>
    </div>

    <model-viewer id="visorModelo" src="" alt="Modelo 3D" ar ar-modes="webxr scene-viewer quick-look" camera-controls
      auto-rotate autoplay shadow-intensity="1">

      <button slot="ar-button" class="btn-proyectar">
        <span></span> Proyectar en el espacio
      </button>

    </model-viewer>

    
    <div class="controls-panel">
      <button class="control-btn" id="plus">+</button>
      <button class="control-btn" id="minus">-</button>
      <button class="control-btn" id="left">↺</button>
      <button class="control-btn" id="right">↻</button>
    </div>

    <button class="btn-captura" id="btnCaptura">📷</button>
  </div>

</body>

</html>
