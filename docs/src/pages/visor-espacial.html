<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <script>
    // Pre-carga anticipada y en paralelo del modelo 3D antes de parsear todo el DOM
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        var modelo = params.get('modelo');
        if (modelo) {
          var isProd = window.location.hostname.includes('github.io');
          var basePath = isProd ? '/AppMindAr/models/' : '/models/';
          var modelUrl = basePath + modelo + '.glb';
          
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'fetch';
          link.href = modelUrl;
          link.crossOrigin = 'anonymous';
          document.head.appendChild(link);
        }
      } catch (e) {
        console.error("Error en precarga dinámica:", e);
      }
    })();
  </script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-40KN126F8R"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-40KN126F8R');
  </script>
  <script>
    // Detección de navegador: agrega clase al <html> antes del primer render
    (function () {
      var ua = navigator.userAgent;
      // Siempre usar el diseño grande (Firefox) para todos los navegadores
      document.documentElement.classList.add('browser-firefox');
    })();
  </script>
  <title id="pageTitle">SIED - AR Espacial</title>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <script type="module" crossorigin src="/AppMindAr/assets/visorEspacial-DYC50vVV.js"></script>
  <link rel="modulepreload" crossorigin href="/AppMindAr/assets/data-xxQ6W8uj.js">
  <link rel="stylesheet" crossorigin href="/AppMindAr/assets/visorEspacial-DXtFSUO5.css">
</head>

<body>

  <!-- Cargador Glassmorphic Premium -->
  <div id="loaderModelo" class="loader-overlay">
    <div class="loader-card">
      <div class="loader-spinner-container">
        <div class="loader-spinner"></div>
        <div class="loader-glow"></div>
      </div>
      <h3 class="loader-title">Cargando Experiencia 3D</h3>
      <p class="loader-subtitle" id="loaderSubtitle">Iniciando descarga...</p>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="loaderBarra"></div>
      </div>
      <div class="progress-percentage" id="loaderPorcentaje">0%</div>
    </div>
  </div>

  <div class="header">
    <div class="model-info">
      <div class="model-name" id="nombreModelo">Cargando...</div>
    </div>
    <button class="close-btn" onclick="window.history.back()" aria-label="Volver">
      <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </button>
  </div>

  <div class="visor-container">

    <model-viewer id="visorModelo" src="" alt="Modelo 3D" ar ar-modes="webxr scene-viewer quick-look" camera-controls
      auto-rotate autoplay shadow-intensity="1">

      <button slot="ar-button" class="btn-proyectar">
        <span></span> Proyectar en el espacio
      </button>

    </model-viewer>


    <div class="controls-panel">
      <button class="control-btn" id="plus">+</button>
      <button class="control-btn" id="minus">-</button>
      <button class="control-btn" id="left">↺</button>
      <button class="control-btn" id="right">↻</button>
    </div>

    <button class="btn-captura" id="btnCaptura">📷</button>
  </div>

</body>

</html>
