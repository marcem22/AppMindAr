<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Minerales - AR Visor</title>
   <link rel="icon" type="image/png" href="/AppMindAr/assets/LOGO%20SIED%20SOLO-01-BluIfg0u.png">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      background: radial-gradient(circle at center, #1a100a 0%, #000 100%);
      color: white; width: 100vw; height: 100dvh; display: flex;
      flex-direction: column; overflow: hidden;
    }

    .header { padding: 20px 25px; display: flex; justify-content: flex-end; align-items: center; background: transparent; z-index: 20; position: absolute; width: 100%; top: 0; left: 0; pointer-events: none; }
    .close-btn { background: rgba(0, 0, 0, 0.4); border: 2px solid #b87333; border-radius: 50%; width: 48px; height: 48px; color: white; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; pointer-events: auto; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(184, 115, 51, 0.3); backdrop-filter: blur(5px); }
    .close-btn:hover { background: #b87333; color: white; transform: scale(1.05); }

    .visor-container { flex-grow: 1; width: 100%; height: 100%; position: relative; }

    model-viewer {
      width: 100%; height: 100%; background: transparent; 
      --poster-color: transparent; touch-action: none;
    }

    .model-info {
      position: absolute; top: 110px; left: 200px !important; transform: none !important; 
      background: rgba(0, 0, 0, 0.5); padding: 12px 24px; border-radius: 12px;
      border: 1px solid rgba(212, 175, 55, 0.3); text-align: left;
      backdrop-filter: blur(10px); z-index: 10; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      pointer-events: none;
    }

    .model-name { font-size: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #fcd581; }

    /* PANEL DE CONTROLES AGREGADO */
    .controls-panel {
      position: absolute; left: 20px; bottom: 30px; display: flex; 
      flex-direction: column; gap: 12px; z-index: 150;
    }

    .control-btn {
      width: 55px; height: 55px; background: rgba(184, 115, 51, 0.2); 
      border: 2px solid #b87333; border-radius: 12px; color: #fcd581; 
      font-size: 24px; font-weight: bold; cursor: pointer; display: flex; 
      align-items: center; justify-content: center; user-select: none;
      transition: all 0.2s; backdrop-filter: blur(4px);
    }

    .control-btn:active { background: #b87333; color: #fff; transform: scale(0.95); }

    .btn-proyectar {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, #fcd581, #b87333); color: #000;
      border: none; border-radius: 30px; padding: 16px 32px; font-size: 16px;
      font-weight: bold; box-shadow: 0 4px 15px rgba(184, 115, 51, 0.4);
      cursor: pointer; display: flex; align-items: center; gap: 10px;
      transition: transform 0.2s, box-shadow 0.2s; z-index: 100;
    }

    .btn-proyectar:active { transform: translateX(-50%) scale(0.95); }

    .btn-captura {
      position: absolute; right: 20px; bottom: 40px; width: 60px; height: 60px;
      background: rgba(184, 115, 51, 0.9); border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%; color: white; font-size: 24px; display: flex;
      align-items: center; justify-content: center; cursor: pointer; z-index: 40;
      box-shadow: 0 4px 15px rgba(184, 115, 51, 0.4); transition: transform 0.2s, background 0.2s;
    }

    .btn-captura:active { transform: scale(0.9); }

    @media (max-width: 768px) {
        .model-info { top: 90px !important; left: 20px !important; padding: 8px 16px; }
        .model-name { font-size: 16px !important; }
        .btn-proyectar { bottom: 30px !important; width: 85% !important; }
        .btn-captura { bottom: 130px !important; right: 15px !important; transform: scale(0.9) !important; }
        .controls-panel { bottom: 130px !important; left: 15px !important; transform: scale(0.9) !important; }
    }

    @media (min-width: 1600px) {
      .header { padding: 40px 60px; }
      .close-btn { width: 80px; height: 80px; font-size: 36px; border-width: 3px; }
      .model-info {  top: 40px !important; left: 80px !important; right: auto; transform: none !important; padding: 15px 35px; border-width: 2px;}
      .model-name { font-size: 35px; }
      .controls-panel { left: 80px; bottom: 80px; gap: 20px; }
      .control-btn { width: 80px; height: 80px; font-size: 36px; border-width: 3px; border-radius: 20px; }
      .btn-captura { width: 100px; height: 100px; font-size: 45px; bottom: 80px; right: 80px; border-width: 3px; }
      .btn-proyectar { padding: 24px 48px; font-size: 24px; bottom: 80px; }
    }
     @media (min-width: 2560px) {
  .header { padding: 100px 120px; }
  .close-btn { width: 130px; height: 130px; font-size: 55px; border-width: 4px; }
  .model-info { top: 120px !important; left: 120px !important; right: auto !important; transform: none !important; padding: 45px 90px; border-width: 4px; border-radius: 30px; }
  .model-name { font-size: 60px; }
  .controls-panel { left: 120px; bottom: 120px; gap: 30px; }
  .control-btn { width: 130px; height: 130px; font-size: 55px; border-width: 4px; border-radius: 30px; }
  .btn-captura { width: 150px; height: 150px; font-size: 70px; bottom: 120px; right: 120px; border-width: 4px; }
  .btn-proyectar { padding: 45px 90px; font-size: 50px; bottom: 120px; border-radius: 90px; }
}
  </style>
  <script type="module" crossorigin src="/AppMindAr/assets/modulepreload-polyfill-B5Qt9EMX.js"></script>
</head>
<body>

 <div class="header">
    <button class="close-btn" onclick="window.history.back()">🏠</button>
  </div>

  <div class="visor-container">
    <div class="model-info">
      <div class="model-name" id="nombreModelo">Cargando...</div>
    </div>

    <model-viewer 
      id="visorModelo"
      src=""
      alt="Modelo 3D"
      ar 
      ar-modes="webxr scene-viewer quick-look" 
      camera-controls 
      touch-action="pan-y"
      auto-rotate
      autoplay
      shadow-intensity="1">
      
      <button slot="ar-button" class="btn-proyectar">
        <span></span> Proyectar en el espacio
      </button>

    </model-viewer>


    <div class="controls-panel">
      <button class="control-btn" id="plus">+</button>
      <button class="control-btn" id="minus">-</button>
      <button class="control-btn" id="left">↺</button>
      <button class="control-btn" id="right">↻</button>
    </div>
    
    <button class="btn-captura" id="btnCaptura">📷</button>
  </div>

  <script>
    const parametrosUrl = new URLSearchParams(window.location.search);

    const modeloSolicitado = parametrosUrl.get('modelo') || 'cuarzo';
    const nombreSolicitado = parametrosUrl.get('nombre') || 'Cuarzo';

    const escalaSolicitadaStr = parametrosUrl.get('escala') || '1 1 1';

    let escalaActual = parseFloat(escalaSolicitadaStr.split(' ')[0]) || 1;

    const stepEscala = escalaActual < 0.1 ? 0.001 : 0.02;

    const visor = document.getElementById('visorModelo');
    const nombreUI = document.getElementById('nombreModelo');
    const btnCaptura = document.getElementById('btnCaptura');

    const isProduction = window.location.hostname.includes('github.io');
    const BASE_PATH = isProduction ? '/AppMindAr/models/' : 'models/';

    visor.src = BASE_PATH + modeloSolicitado + '.glb';
    nombreUI.textContent = nombreSolicitado;
    
    visor.scale = `${escalaActual} ${escalaActual} ${escalaActual}`;

    // LÓGICA DE LOS BOTONES
    let timer;
    function iniciarAccion(accion) { accion(); timer = setInterval(accion, 40); }
    function detenerAccion() { clearInterval(timer); }

    const acciones = {
      plus: () => { escalaActual += stepEscala; visor.scale = `${escalaActual} ${escalaActual} ${escalaActual}`; },
      minus: () => { if (escalaActual > stepEscala) escalaActual -= stepEscala; visor.scale = `${escalaActual} ${escalaActual} ${escalaActual}`; },
      left: () => { const o = visor.getCameraOrbit(); visor.cameraOrbit = `${o.theta - 0.05}rad ${o.phi}rad ${o.radius}m`; },
      right: () => { const o = visor.getCameraOrbit(); visor.cameraOrbit = `${o.theta + 0.05}rad ${o.phi}rad ${o.radius}m`; }
    };

    ['plus', 'minus', 'left', 'right'].forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('mousedown', () => iniciarAccion(acciones[id]));
      el.addEventListener('touchstart', (e) => { e.preventDefault(); iniciarAccion(acciones[id]); }, { passive: false });
      el.addEventListener('mouseup', detenerAccion);
      el.addEventListener('mouseleave', detenerAccion);
      el.addEventListener('touchend', detenerAccion);
    });

    // FOTO
    btnCaptura.addEventListener('click', async () => {
      btnCaptura.style.background = "#d4af37";
      try {
        const blob = await visor.toBlob({ idealAspect: true });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = `MineralAR-${Date.now()}.png`;
        link.href = url;
        link.click();
        URL.revokeObjectURL(url);
      } catch (error) {
        console.error(error);
      }
      setTimeout(() => {
        btnCaptura.style.background = "rgba(184, 115, 51, 0.9)";
      }, 500);
    });
  </script>
</body>
</html>
