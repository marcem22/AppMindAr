<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>SIED - Dino AR</title>
   <link rel="icon" type="image/png" href="assets/LOGO SIED SOLO-01.png">
  
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background-color: #111; color: white;
      width: 100vw; height: 100dvh;
      display: flex; flex-direction: column; overflow: hidden;
    }

    .header {
      padding: 15px 25px; display: flex; justify-content: space-between; align-items: center;
      background: rgba(0,0,0,0.8); z-index: 20; position: absolute; width: 100%; top: 0; left: 0;
    }

    .header-logo { max-height: 80px; width: auto; }

    .close-btn {
      background: rgba(0,0,0,0.5); border: 2px solid white; border-radius: 50%;
      width: 44px; height: 44px; color: white; font-size: 22px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; text-decoration: none;
    }

    .visor-container { flex-grow: 1; width: 100%; position: relative; margin-top: 100px; }

    model-viewer {
      width: 100%; height: 100%; background-color: #222; 
      --poster-color: transparent; touch-action: none; 
    }

    .btn-proyectar {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      background-color: #00ff99; color: #000; border: none; border-radius: 30px;
      padding: 15px 30px; font-size: 16px; font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,255,153,0.4); cursor: pointer; z-index: 100;
    }

    .model-info {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 10px;
      border: 1px solid #00ff99; text-align: center; pointer-events: none; z-index: 10;
    }

    .model-name { font-size: 18px; font-weight: bold; }

    .controls-panel {
      position: absolute; left: 20px; bottom: 30px;
      display: flex; flex-direction: column; gap: 12px; z-index: 150;
    }

    .control-btn {
      width: 55px; height: 55px; background: rgba(0, 255, 153, 0.2); border: 2px solid #00ff99;
      border-radius: 12px; color: #00ff99; font-size: 24px; font-weight: bold; cursor: pointer; 
      display: flex; align-items: center; justify-content: center; user-select: none;
    }

    .control-btn:active { background: #00ff99; color: #000; }

    .btn-captura {
      position: absolute; right: 20px; bottom: 30px; width: 60px; height: 60px;
      background: rgba(0,255,153,0.9); border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; 
      color: white; font-size: 24px; display: flex; align-items: center; justify-content: center; 
      cursor: pointer; z-index: 40; box-shadow: 0 4px 15px rgba(0,255,153,0.4);
    }

    @media (max-width: 768px) {
      .model-info {
        top: 15px !important; 
        left: 50% !important;
        transform: translateX(-50%) !important;
      }
      .btn-proyectar {
        bottom: 30px !important; 
        width: 85% !important; 
      }
      .btn-captura {
        bottom: 130px !important; 
        right: 15px !important;
        transform: scale(0.9) !important;
      }
      .controls-panel {
        bottom: 130px !important; 
        left: 15px !important;
        transform: scale(0.9) !important;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="./assets/LOGO SIED SOLO-01.png" class="header-logo" alt="SIED">
    <button class="close-btn" onclick="window.location.href='index-dino.html'">🏠</button>
  </div>

  <div class="visor-container">
    <div class="model-info">
      <div class="model-name" id="nombreDino">Cargando...</div>
    </div>

   <model-viewer 
      id="visorDino"
      src=""
      alt="Modelo 3D"
      ar 
      ar-modes="webxr scene-viewer quick-look" 
      camera-controls 
      touch-action="pan-y"
      shadow-intensity="1">
      
      <button slot="ar-button" class="btn-proyectar">Proyectar en el piso</button>
    </model-viewer>

    <div class="controls-panel">
      <button class="control-btn" id="plus">+</button>
      <button class="control-btn" id="minus">-</button>
      <button class="control-btn" id="left">↺</button>
      <button class="control-btn" id="right">↻</button>
    </div>
    
    <button class="btn-captura" id="btnCaptura">📷</button>
  </div>

 <script>
  const dinos = [
    { slug: 'brachiosaurus', archivo: 'brachiosaurus.glb', sonido: 'sounds/brachiosaurus.mp3', nombre: 'Brachiosaurus', escalaWeb: 0.05, orientacion: '0deg 0deg 0deg' },
    { slug: 'trex', archivo: 'trex.glb', sonido: 'sounds/trex.mp3', nombre: 'T-Rex', escalaWeb: 0.15, orientacion: '0deg 0deg 0deg' },
    { slug: 'triceratops', archivo: 'triceratops.glb', sonido: 'sounds/triceratops.mp3', nombre: 'Triceratops', escalaWeb: 1, orientacion: '0deg 0deg 0deg' },
    { slug: 'velociraptor', archivo: 'velociraptor.glb', sonido: 'sounds/velociraptor.mp3', nombre: 'Velociraptor', escalaWeb: 0.495, orientacion: '0deg 0deg 0deg'},
    { slug: 'stegosaurio', archivo: 'stegosaurio.glb', sonido: 'sounds/stegosaurio.mp3', nombre: 'Stegosaurus', escalaWeb: 0.05, orientacion: '0deg 0deg 0deg' },
    { slug: 'ankylosaurus', archivo: 'ankylosaurus.glb', sonido: 'sounds/ankylosaurus.mp3', nombre: 'Ankylosaurus', escalaWeb: 0.001, orientacion: '0deg 0deg 0deg' }
  ];

  const params = new URLSearchParams(window.location.search);
  const modUrl = params.get('modelo') || params.get('marker') || 'trex';

  const isProd = window.location.hostname.includes('github.io');
  const BASE_PATH = isProd ? '/AppMindAr/models/' : 'models/';

  const visor = document.getElementById('visorDino');
  const nombreUI = document.getElementById('nombreDino');
  const reproductorAudio = new Audio();

  const dinoData = dinos.find(d => d.slug === modUrl) || dinos[1];
  let escalaActual = dinoData.escalaWeb;

  function cargarDino() {
    const pathGlb = BASE_PATH + dinoData.archivo;

    visor.src = pathGlb;
    nombreUI.textContent = dinoData.nombre;
    visor.scale = `${escalaActual} ${escalaActual} ${escalaActual}`;
    visor.orientation = dinoData.orientacion || '0deg 0deg 0deg';
    
    const soundPath = isProd ? '/AppMindAr/' + dinoData.sonido : dinoData.sonido;
    reproductorAudio.src = soundPath;
  }

  cargarDino();

  document.body.addEventListener('click', () => {
    if (reproductorAudio.paused) reproductorAudio.play().catch(() => {});
  }, { once: true });

  let timer;
  function iniciarAccion(accion) { accion(); timer = setInterval(accion, 40); }
  function detenerAccion() { clearInterval(timer); }

  const acciones = {
    plus: () => { escalaActual += 0.002; visor.scale = `${escalaActual} ${escalaActual} ${escalaActual}`; },
    minus: () => { if (escalaActual > 0.002) escalaActual -= 0.002; visor.scale = `${escalaActual} ${escalaActual} ${escalaActual}`; },
    left: () => { const o = visor.getCameraOrbit(); visor.cameraOrbit = `${o.theta - 0.05}rad ${o.phi}rad ${o.radius}m`; },
    right: () => { const o = visor.getCameraOrbit(); visor.cameraOrbit = `${o.theta + 0.05}rad ${o.phi}rad ${o.radius}m`; }
  };

  ['plus', 'minus', 'left', 'right'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('mousedown', () => iniciarAccion(acciones[id]));
    el.addEventListener('touchstart', (e) => { e.preventDefault(); iniciarAccion(acciones[id]); }, { passive: false });
    el.addEventListener('mouseup', detenerAccion);
    el.addEventListener('mouseleave', detenerAccion);
    el.addEventListener('touchend', detenerAccion);
  });

  const btnCaptura = document.getElementById('btnCaptura');
  btnCaptura.addEventListener('click', async () => {
    btnCaptura.style.background = "orange";
    try {
      const blob = await visor.toBlob({ idealAspect: true });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.download = `Dino-${Date.now()}.png`;
      link.href = url; link.click(); URL.revokeObjectURL(url);
    } catch (e) {}
    setTimeout(() => { btnCaptura.style.background = "rgba(0,255,153,0.9)"; }, 500);
  });

</script>
</body>
</html>
